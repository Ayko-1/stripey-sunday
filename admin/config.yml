# ─────────────────────────────────────────────────────────────────────────────
# Sveltia CMS — stripey sunday
# Light Git-based CMS so Aliyah can edit photos without touching code.
# Docs: https://github.com/sveltia/sveltia-cms
# ─────────────────────────────────────────────────────────────────────────────

# Backend: GitHub. Uses Personal Access Token (PAT) for sign-in.
# Sveltia's previously-hosted OAuth proxy (api.sveltia.com) was shut down,
# so until the Cloudflare Worker is set up, we use a PAT.
# See README on how to create one (Settings → Developer settings → Tokens).
backend:
  name: github
  repo: Ayko-1/stripey-sunday
  branch: main

# Where uploaded images land, and the public URL prefix Sveltia serves them from.
media_folder: "mockups/images"
public_folder: "/mockups/images"

# ─── Collections ────────────────────────────────────────────────────────────
collections:
  - name: "photos"
    label: "Photos"
    label_singular: "Photo"
    description: "The stays gallery. Drag to reorder. Toggle Featured to make a photo render as a wider half-width cell."
    files:
      - name: "photos-data"
        label: "Photo gallery"
        file: "data/photos.json"
        format: "json"
        fields:
          - name: "items"
            label: "Photos"
            widget: "list"
            summary: "{{fields.name}} — {{fields.meta}}"
            fields:
              - name: "src"
                label: "Image"
                widget: "image"
                hint: "Drag a new image in to upload, or pick an existing one from /mockups/images/."
              - name: "name"
                label: "Caption (big text)"
                widget: "string"
                hint: "Hotel name, room name, or short title. Shown in bold over the photo on hover."
              - name: "meta"
                label: "Meta (small text under caption)"
                widget: "string"
                hint: "Format: City · Year, e.g. 'Bintan · 2025'."
              - name: "featured"
                label: "Featured (renders wider, half-width)"
                widget: "boolean"
                required: false
                default: false
                hint: "Turn on for the 2 photos that should appear in the wide closing pair. Leave off for normal 3-per-row photos."

# ─── Settings ───────────────────────────────────────────────────────────────
publish_mode: editorial_workflow
locale: en
