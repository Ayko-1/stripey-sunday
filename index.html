<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>stripey sunday — ugc for stays, in exchange for the room</title>
    <meta
      name="description"
      content="Stripey Sunday is a two-person content studio trading frames for stays. We travel slowly and photograph the places we sleep in — and a few of those properties have been kind enough to host us in exchange for the photos."
    />
    <meta name="theme-color" content="#f4e6c8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Big+Shoulders+Display:wght@700;800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ─── Top navigation ─── -->
    <header class="nav" data-nav>
      <a class="nav__brand" href="#top" aria-label="stripey sunday — home">
        <span class="nav__mark">stripey sunday<span class="dot">.</span></span>
      </a>
      <nav class="nav__links" aria-label="Primary">
        <a href="#work">stays</a>
        <a href="#contact">say hi</a>
      </nav>
    </header>

    <!-- ─── Hero — full-bleed looping video, brand wordmark ─── -->
    <section class="hero" id="top">
      <video
        class="hero__image"
        src="assets/hero.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="mockups/images/hero-source.jpg"
        aria-hidden="true"
      ></video>
      <div class="hero__veil" aria-hidden="true"></div>

      <div class="hero__inner">
        <h1 class="hero__wordmark">stripey sunday</h1>
        <p class="hero__tag">ugc for hotels, airbnbs &amp; retreats · in exchange for the room</p>
      </div>
    </section>

    <!-- ─── The statement — one bold line ─── -->
    <section class="statement" id="statement">
      <h2 class="statement__title">
        Stay longer.
      </h2>
    </section>

    <!-- ─── Stays — the photo grid (renders from photos.js) ─── -->
    <section class="work" id="work">
      <div class="grid" id="grid"><!-- populated by script.js from window.STRIPEY_PHOTOS --></div>
    </section>

    <!-- ─── Contact — the deep teal counterpoint ─── -->
    <section class="contact" id="contact">
      <div class="contact__inner">
        <p class="contact__word">stripey sunday<span class="dot">.</span></p>
        <a class="contact__email" href="mailto:hello@stripeysunday.studio">
          hello@stripeysunday.studio
        </a>
      </div>
    </section>

    <!-- ─── Footer ─── -->
    <footer class="foot">
      <div class="foot__inner">
        <span>stripey sunday <span class="dot">·</span> A small studio.</span>
        <span>© <span id="year">2025</span></span>
      </div>
    </footer>

    <script src="script.js?v=4" defer></script>
  </body>
</html>
